<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tienda BEG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
/* Layout: cabecera azul marino fija, contenido en columna ancha con tarjetas blancas sobre gris frío; barra inferior en celular. */
:root{
  --navy:#0A1628; --navy-2:#13294B;
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#0A1628; --muted:#586376; --line:#E0E5EC;
  --btn:#0A1628; --btn-ink:#FFFFFF; --btn-hover:#16305A;
  --soft:#EAEEF4; --ghost-hover:#E2E8F1;
  --ok:#17653A; --ok-bg:#E3F3EA; --warn:#8A5A00; --warn-bg:#FBF0D9; --info:#1B4C8C; --info-bg:#E4EDFA; --bad:#9B2C2C;
  --shadow:0 1px 2px rgba(10,22,40,.06),0 8px 24px rgba(10,22,40,.07);
  --shadow-hover:0 2px 4px rgba(10,22,40,.08),0 16px 36px rgba(10,22,40,.13);
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#060D18; --navy-2:#0F2243;
  --bg:#070F1C; --surface:#0E1A2E; --ink:#EDF1F7; --muted:#9BA7BA; --line:#1D2E48;
  --btn:#E9EEF6; --btn-ink:#0A1628; --btn-hover:#FFFFFF;
  --soft:#14233B; --ghost-hover:#1A2D4A;
  --ok:#7FD6A3; --ok-bg:#12301F; --warn:#F0C36B; --warn-bg:#33270C; --info:#8DB8F2; --info-bg:#132845; --bad:#F29A9A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-hover:0 2px 4px rgba(0,0,0,.5),0 16px 36px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#060D18; --navy-2:#0F2243;
  --bg:#070F1C; --surface:#0E1A2E; --ink:#EDF1F7; --muted:#9BA7BA; --line:#1D2E48;
  --btn:#E9EEF6; --btn-ink:#0A1628; --btn-hover:#FFFFFF;
  --soft:#14233B; --ghost-hover:#1A2D4A;
  --ok:#7FD6A3; --ok-bg:#12301F; --warn:#F0C36B; --warn-bg:#33270C; --info:#8DB8F2; --info-bg:#132845; --bad:#F29A9A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-hover:0 2px 4px rgba(0,0,0,.5),0 16px 36px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;padding-inline:0;padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;line-height:1.15}
p{margin:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{width:100%;max-width:1180px;margin-inline:auto;padding-inline:16px}
.num{font-variant-numeric:tabular-nums}

/* Franja superior */
.strip{background:var(--navy-2);color:#E6ECF6;font-size:12.5px}
.strip .wrap{display:flex;gap:8px 24px;justify-content:center;flex-wrap:wrap;padding-block:7px}
.strip span{display:inline-flex;align-items:center;gap:6px}
.strip .ic{width:15px;height:15px}

/* Cabecera */
.hdr{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.hdr-in{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:11px;background:none;border:0;color:#fff;padding:0;text-align:left}
.logo-badge{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.logo-badge img{width:100%;height:100%;object-fit:contain;display:block}
.brand-t{display:flex;flex-direction:column;line-height:1.1}
.brand-t b{font-family:var(--font-display);font-size:24px;letter-spacing:.08em;font-weight:600}
.brand-t small{font-size:11px;opacity:.72;letter-spacing:.04em}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{background:none;border:0;color:#D5DEEC;padding:8px 12px;border-radius:8px;font-weight:500;font-size:14.5px;transition:background .2s,color .2s}
.nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.nav button[aria-current="page"]{color:#fff;background:rgba(255,255,255,.14)}
.search{flex:1 1 280px;display:flex;align-items:center;background:#fff;border-radius:11px;padding:3px 3px 3px 12px;gap:8px;min-width:0;max-width:560px;margin-inline:auto}
.search .ic{color:#5a6678}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:#0A1628;padding:8px 0;font-size:14.5px}
.search input::placeholder{color:#6d788a}
.search button{background:var(--navy-2);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px;transition:background .2s}
.search button:hover{background:#1d3d70}
.hdr-act{display:flex;gap:6px;margin-left:auto}
.ibtn{position:relative;background:rgba(255,255,255,.08);border:0;color:#fff;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;transition:background .2s,transform .2s}
.ibtn:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.ibtn .av{width:30px;height:30px;border-radius:50%;object-fit:cover}
.badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:#fff;color:#0A1628;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--navy)}
.badge:empty{display:none}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:var(--btn-ink);border:1.5px solid var(--btn);border-radius:11px;padding:11px 18px;font-weight:600;font-size:14.5px;text-decoration:none;transition:background .2s,transform .2s,box-shadow .2s}
.btn:hover{background:var(--btn-hover);border-color:var(--btn-hover);transform:translateY(-1px);box-shadow:0 6px 16px rgba(10,22,40,.2)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--ghost-hover);border-color:var(--muted);box-shadow:none}
.btn.light{background:#fff;color:#0A1628;border-color:#fff}
.btn.light:hover{background:#E8EEF8;border-color:#E8EEF8}
.btn.line-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.btn.line-light:hover{background:rgba(255,255,255,.12);border-color:#fff;box-shadow:none}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:9px}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--info);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Vistas */
main{padding-block:26px 56px}
.view{display:flex;flex-direction:column;gap:30px;animation:in .35s ease both}
@keyframes in{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(22px,3vw,30px)}
.sec-h p{color:var(--muted);margin-top:4px;max-width:60ch}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--muted);background:none;border:0;padding:0;font-weight:500}
.crumb:hover{color:var(--ink)}

/* Héroe */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;border-radius:22px;padding:clamp(22px,4vw,46px);display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-90px;top:-90px;width:320px;height:320px;border-radius:50%;border:1px solid rgba(255,255,255,.1)}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:200px;height:200px;border-radius:50%;border:1px solid rgba(255,255,255,.08)}
.hero-t{display:flex;flex-direction:column;gap:16px;position:relative;z-index:1;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.75}
.hero h1{font-size:clamp(30px,5vw,50px)}
.hero p{color:#CBD6E8;max-width:46ch}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hero-card{position:relative;z-index:1;background:#fff;border-radius:18px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.35);transition:transform .3s;color:#0A1628;border:0;text-align:left;min-width:0;width:100%}
.hero-card:hover{transform:translateY(-4px) rotate(-.4deg)}
.hero-card img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;max-width:100%}
.hero-card .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 4px 2px;flex-wrap:wrap}
.hero-card .meta b{font-size:15px}
.hero-card .meta span{font-weight:700}

/* Ventajas */
.perks{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.perk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.perk .ic{width:24px;height:24px;color:var(--info)}
.perk b{display:block;font-size:14.5px}
.perk span{font-size:13px;color:var(--muted)}

/* Filtros */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 15px;font-weight:500;font-size:14px;transition:background .2s,border-color .2s}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}

/* Productos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s;min-width:0}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
.card-img{display:block;width:100%;border:0;padding:0;background:#fff;cursor:pointer;overflow:hidden}
.card-img img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;transition:transform .4s;max-width:100%}
.card:hover .card-img img{transform:scale(1.05)}
.card-b{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.tag{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card h3{font-size:19px}
.card h3 button{background:none;border:0;padding:0;text-align:left;font:inherit;letter-spacing:inherit;cursor:pointer}
.card h3 button:hover{text-decoration:underline;text-underline-offset:3px}
.card p.d{color:var(--muted);font-size:14px}
.price-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.price{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.off{background:var(--soft);color:var(--muted)}
.card-act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.card-act .btn{padding-inline:10px}

/* Detalle */
.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:start}
.gallery{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;max-width:100%}
.info{display:flex;flex-direction:column;gap:14px;min-width:0}
.info h1{font-size:clamp(28px,4vw,38px)}
.info .price{font-size:32px}
.info .lead{color:var(--muted);font-size:16px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:11px;background:var(--surface);overflow:hidden}
.qty button{background:none;border:0;width:38px;height:40px;display:grid;place-items:center;transition:background .2s}
.qty button:hover{background:var(--soft)}
.qty span{min-width:34px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.buy-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.buy-row .btn{flex:1 1 170px}
.specs{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.specs div{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:11px 16px;border-top:1px solid var(--line);font-size:14px}
.specs div:first-child{border-top:0}
.specs dt{color:var(--muted)}
.specs dd{margin:0;min-width:0}

/* Carrito */
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;min-width:0}
.lines{display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center;padding-block:16px;border-top:1px solid var(--line)}
.line:first-child{border-top:0;padding-top:0}
.line:last-child{padding-bottom:0}
.line img{width:96px;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line);display:block}
.line .n{font-weight:600}
.line .u{color:var(--muted);font-size:13.5px}
.line-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.line-r .sub{font-weight:700;font-variant-numeric:tabular-nums}
.rm{background:none;border:0;color:var(--muted);display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:2px}
.rm:hover{color:var(--bad)}
.sum{display:flex;flex-direction:column;gap:12px}
.sum h3{font-size:20px}
.sum .r{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.sum .r span:first-child{color:var(--muted)}
.sum .tot{border-top:1px solid var(--line);padding-top:14px;font-size:19px;font-weight:700}
.sum .tot span:first-child{color:var(--ink)}
.empty{text-align:center;padding:44px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .ic{width:42px;height:42px;color:var(--muted)}
.empty p{color:var(--muted);max-width:42ch}

/* Formularios */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:600}
.f input,.f select,.f textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%;transition:border-color .2s,background .2s}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--info);background:var(--surface)}
.f small{color:var(--muted);font-size:12px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay label{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;font-weight:500;transition:border-color .2s,background .2s}
.pay label:hover{border-color:var(--muted)}
.pay input{accent-color:var(--btn);width:auto}
.pay label:has(input:checked){border-color:var(--ink);background:var(--soft)}

/* Compras */
.orders{display:flex;flex-direction:column;gap:16px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.order-h{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--soft)}
.order-h .m{display:flex;gap:6px 26px;flex-wrap:wrap}
.order-h .m div{display:flex;flex-direction:column;font-size:12px;color:var(--muted)}
.order-h .m b{font-size:14.5px;color:var(--ink);font-weight:600}
.order-b{padding:6px 18px}
.oi{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.oi:first-child{border-top:0}
.oi img{width:64px;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line);display:block}
.oi .t{font-weight:600}
.oi .q{color:var(--muted);font-size:13.5px}
.oi .p{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.order-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.order-f b{font-size:17px;font-variant-numeric:tabular-nums}
.demo{font-size:11.5px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 7px}

/* Perfil */
.prof{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
.id{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.avatar{width:112px;height:112px;border-radius:50%;background:var(--navy-2);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-size:40px;overflow:hidden;box-shadow:0 0 0 4px var(--surface),0 0 0 5px var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.id h2{font-size:22px}
.id .em{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.id .btns{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.stat{background:var(--soft);border-radius:12px;padding:10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.vh{display:none}

/* Nosotros */
.about-h{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:center}
.about-logo{background:#fff;border-radius:50%;width:240px;max-width:100%;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.about-logo img{width:100%;height:100%;object-fit:contain;display:block}
.about-h h1{font-size:clamp(28px,4vw,40px);margin-bottom:10px}
.about-h p{color:var(--muted);max-width:62ch}
.about-h p+p{margin-top:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mini h3{font-size:18px}
.mini p{color:var(--muted);font-size:14px}
.mini .ic{color:var(--info);width:24px;height:24px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:0;padding:0;list-style:none}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.steps b{display:block;margin-bottom:4px}
.steps span{color:var(--muted);font-size:13.5px}
.contact{display:flex;flex-direction:column}
.crow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.crow:first-child{border-top:0;padding-top:0}
.crow:last-child{padding-bottom:0}
.crow .k{color:var(--muted);font-size:13px}
.crow .v{font-weight:600;overflow-wrap:anywhere;user-select:all}
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.team .mini h3{font-size:16px}
.priv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.priv div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13.5px;color:var(--muted)}
.priv b{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}

/* Pie */
footer{background:var(--navy);color:#C9D4E6;margin-top:10px}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px;padding-block:34px}
.foot b{color:#fff;display:block;margin-bottom:8px;font-family:var(--font-display);font-size:17px}
.foot p,.foot button{font-size:13.5px}
.foot .ls{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.foot button{background:none;border:0;color:#C9D4E6;padding:0;text-align:left}
.foot button:hover{color:#fff;text-decoration:underline}
.copy{border-top:1px solid rgba(255,255,255,.12);font-size:12.5px;opacity:.75;padding-block:14px}

/* Barra inferior móvil */
.tabbar{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;font-weight:500;display:flex;gap:9px;align-items:center;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ok-big{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.ok-big .ic{width:32px;height:32px;stroke-width:2.2}

@media (max-width:980px){
  .hero{grid-template-columns:1fr}
  .perks{grid-template-columns:1fr 1fr}
  .steps,.team{grid-template-columns:1fr 1fr}
  .three{grid-template-columns:1fr}
  .detail,.cols,.prof{grid-template-columns:1fr}
  .about-h{grid-template-columns:1fr;justify-items:start}
  .about-logo{width:180px}
}
@media (max-width:760px){
  .nav{display:none}
  .search{order:3;flex:1 1 100%;max-width:none}
  .hdr-act{margin-left:auto}
  .brand-t small{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--navy);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 18px rgba(0,0,0,.25)}
  .tabbar button{background:none;border:0;color:#B8C5DA;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 0;position:relative;border-radius:10px;font-weight:500}
  .tabbar button[aria-current="page"]{color:#fff;background:rgba(255,255,255,.1)}
  .tabbar .badge{top:0;right:calc(50% - 22px)}
  main{padding-bottom:96px}
  .priv,.form,.pay{grid-template-columns:1fr}
  .foot{grid-template-columns:1fr}
  .line{grid-template-columns:76px 1fr;}
  .line img{width:76px}
  .line-r{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .oi{grid-template-columns:56px 1fr}
  .oi img{width:56px}
  .oi .p{grid-column:2;text-align:left}
  .specs div{grid-template-columns:1fr;gap:2px}
  .perks{grid-template-columns:1fr}
  .steps,.team{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function P(id){return PRODUCTS.filter(function(p){return p.id===id})[0]}
function stockOf(id){var p=P(id);var used=S.stock[id]||0;return Math.max(0,p.stock-used)}

var VIEWS={home:vHome,catalogo:vCatalogo,detail:vDetail,carrito:vCarrito,checkout:vCheckout,gracias:vGracias,compras:vCompras,perfil:function(){return vPerfil()},nosotros:vNosotros};
function render(){
  var v=VIEWS[S.view]||vHome;
  document.getElementById('app').innerHTML=v();
  var cur={home:'home',catalogo:'catalogo',detail:'catalogo',compras:'compras',nosotros:'nosotros',carrito:'carrito',checkout:'carrito',perfil:'perfil'}[S.view];
  document.querySelectorAll('[data-go]').forEach(function(b){
    if(b.closest('.nav')||b.closest('.tabbar')||b.classList.contains('ibtn')){
      if(b.dataset.go===cur)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}});
  var pb=document.getElementById('profBtn');
  pb.innerHTML=(S.user&&S.user.photo)?'<img class="av" src="'+S.user.photo+'" alt="Mi perfil">':ic('user');
  paintCount();
}
function go(view,param,scroll){
  S.view=view;S.param=param||null;if(view==='detail')S.dq=1;
  render();
  var t=scroll&&document.getElementById(scroll);
  if(t)t.scrollIntoView({behavior:'smooth',block:'start'});else window.scrollTo({top:0,behavior:'auto'});
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-go],[data-act]');if(!el)return;
  if(el.dataset.act){act(el);return}
  go(el.dataset.go,el.dataset.id,el.dataset.scroll);
});
function act(el){
  var a=el.dataset.act,id=el.dataset.id;
  if(a==='add'){if(addToCart(id)){toast('Agregado al carrito')}}
  else if(a==='buy'){if(addToCart(id))go('carrito')}
  else if(a==='addq'){if(addToCart(id,S.dq))toast('Agregado al carrito')}
  else if(a==='buynow'){if(addToCart(id,S.dq))go('carrito')}
  else if(a==='dq'){var s=stockOf(S.param);S.dq=Math.max(1,Math.min(s||1,S.dq+Number(id)));document.getElementById('dq').textContent=S.dq}
  else if(a==='lq'){var l=S.cart.filter(function(x){return x.id===id})[0];if(l)setQty(id,l.qty+Number(el.dataset.d))}
  else if(a==='rm'){removeLine(id)}
  else if(a==='cat'){S.cat=id;render()}
  else if(a==='clear'){S.cat='Todas';S.q='';document.getElementById('q').value='';render()}
  else if(a==='again'){var o=S.orders.filter(function(x){return x.id===id})[0];if(o){o.items.forEach(function(i){addToCart(i.id,i.qty)});go('carrito')}}
  else if(a==='logout'){S.user=null;save();toast('Sesión cerrada');render()}
  else if(a==='copy'){
    var v=id,done=function(){toast('Copiado')};
    try{navigator.clipboard.writeText(v).then(done,function(){toast('Selecciona el texto para copiarlo')})}catch(err){toast('Selecciona el texto para copiarlo')}}
}

document.getElementById('searchForm').addEventListener('submit',function(e){
  e.preventDefault();S.q=document.getElementById('q').value;S.cat='Todas';go('catalogo')});

document.addEventListener('submit',function(e){
  var f=e.target;
  if(f.id==='searchForm')return;
  e.preventDefault();
  if(f.id==='loginForm'){
    var n=document.getElementById('lg-n').value.trim(),em=document.getElementById('lg-e').value.trim(),er=document.getElementById('lgErr');
    if(!n||!/^\S+@\S+\.\S+$/.test(em)){er.textContent='Escribe tu nombre y un correo válido.';er.hidden=false;return}
    S.user={name:n,email:em,phone:'',photo:''};save();toast('Sesión iniciada');render();return}
  if(f.id==='profForm'){
    var pn=document.getElementById('pf-n').value.trim(),pe=document.getElementById('pf-e').value.trim(),pr=document.getElementById('pfErr');
    if(!pn||!/^\S+@\S+\.\S+$/.test(pe)){pr.textContent='Revisa que el nombre y el correo sean válidos.';pr.hidden=false;return}
    S.user.name=pn;S.user.email=pe;S.user.phone=document.getElementById('pf-t').value.trim();save();toast('Datos guardados');render();return}
  if(f.id==='coForm'){
    var nm=document.getElementById('co-n').value.trim(),tel=document.getElementById('co-t').value.trim(),dir=document.getElementById('co-d').value.trim(),ce=document.getElementById('coErr');
    var pay=(f.querySelector('input[name=pay]:checked')||{}).value||'Yape';
    if(!nm||tel.replace(/\D/g,'').length<7||!dir){ce.textContent='Completa tu nombre, un celular válido y la dirección de entrega.';ce.hidden=false;return}
    for(var i=0;i<S.cart.length;i++){if(S.cart[i].qty>stockOf(S.cart[i].id)){ce.textContent='Uno de los productos ya no tiene stock suficiente. Revisa tu carrito.';ce.hidden=false;return}}
    var d=new Date(),iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var order={id:'BEG-'+String(S.nextOrder).padStart(4,'0'),date:iso,pay:pay,status:pay==='Efectivo contra entrega'?'En preparación':'Pendiente de pago',
      items:S.cart.map(function(l){S.stock[l.id]=(S.stock[l.id]||0)+l.qty;return {id:l.id,qty:l.qty,price:P(l.id).price}})};
    S.nextOrder++;S.orders.unshift(order);S.cart=[];S.pay=pay;
    if(!S.user.phone)S.user.phone=tel;
    save();go('gracias')}
});
document.addEventListener('change',function(e){
  if(e.target.id==='photoIn'&&e.target.files&&e.target.files[0]){
    var fr=new FileReader();fr.onload=function(){
      var im=new Image();im.onload=function(){
        var c=document.createElement('canvas'),s=240;c.width=s;c.height=s;
        var m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;
        c.getContext('2d').drawImage(im,sx,sy,m,m,0,0,s,s);
        S.user.photo=c.toDataURL('image/jpeg',.82);save();toast('Foto actualizada');render()};
      im.src=fr.result};
    fr.readAsDataURL(e.target.files[0])}
});

load();render();
</script>
